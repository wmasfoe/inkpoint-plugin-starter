name: Publish plugin release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      # Keep the release invisible until every validated asset has uploaded.
      - run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" dist/*.json
          gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
